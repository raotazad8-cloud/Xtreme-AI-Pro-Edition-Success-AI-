<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtreme AI - Next Gen Knowledge Engine</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #111827;
            border: 1px solid #1f2937;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 40px;
        }
        h1 { text-align: center; color: #00ffcc; margin-bottom: 5px; font-size: 28px; }
        .subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00ffcc; font-weight: bold; font-size: 14px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #374151; background: #1f2937;
            color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        input:focus { outline: none; border-color: #00ffcc; }
        button {
            width: 100%; padding: 14px; background: #00ffcc; color: #0b0f19; border: none;
            border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #00cc99; box-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .result-box {
            margin-top: 25px; padding: 15px; border-radius: 6px; display: none;
            border-left: 5px solid; font-size: 15px; line-height: 1.6; white-space: pre-line;
        }
        .success { background: #064e3b; border-color: #10b981; color: #ecfdf5; }
        .warning { background: #78350f; border-color: #f59e0b; color: #fef3c7; }
        .error { background: #7f1d1d; border-color: #ef4444; color: #fef2f2; }
        footer { text-align: center; margin-top: 30px; color: #4b5563; font-size: 11px; border-top: 1px solid #1f2937; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 XTREME AI v3.0</h1>
    <div class="subtitle">Next-Generation Data Extraction Engine<br><b>Powered by Xtreme IT Solution Limited</b></div>
    
    <div class="form-group">
        <label>১. মূল টপিক বা বিষয়ের নাম লিখুন:</label>
        <input type="text" id="topic" placeholder="যেমন: বাংলাদেশ, কম্পিউটার, কৃত্রিম বুদ্ধিমত্তা">
    </div>
    
    <div class="form-group">
        <label>২. টপিকের ভেতর কোন নির্দিষ্ট তথ্যটি খুঁজছেন?</label>
        <input type="text" id="keyword" placeholder="যেমন: ঢাকা, প্রসেসর, জন ম্যাকার্থি">
    </div>
    
    <button onclick="analyzeData()">Analyze Data ⚡</button>
    
    <div id="result" class="result-box"></div>
    
    <footer>© 2026 Xtreme IT Solution Limited. All Rights Reserved. Private Knowledge Network.</footer>
</div>

<script>
async function analyzeData() {
    const topic = document.getElementById('topic').value;
    const keyword = document.getElementById('keyword').value;
    const resultBox = document.getElementById('result');
    
    if(!topic || !keyword) {
        alert("দয়া করে দুটি ইনপুটই পূরণ করুন।");
        return;
    }
    
    resultBox.style.display = "block";
    resultBox.className = "result-box warning";
    resultBox.innerText = "🔄 Xtreme AI কোর ডেটাবেস স্ক্যান করছে...";
    
    try {
        const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic, keyword })
        });
        const data = await response.json();
        
        if(data.status === "success") {
            resultBox.className = "result-box success";
            resultBox.innerHTML = `<strong>${data.title}</strong><br><br>${data.content}`;
        } else if(data.status === "summary") {
            resultBox.className = "result-box warning";
            resultBox.innerHTML = `<strong>${data.title}</strong><br><br>${data.content}`;
        } else {
            resultBox.className = "result-box error";
            resultBox.innerText = data.message;
        }
    } catch (error) {
        resultBox.className = "result-box error";
        resultBox.innerText = "সার্ভারের সাথে কানেক্ট করতে সমস্যা হচ্ছে।";
    }
}
</script>
</body>
</html>
